services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer_service
      POSTGRES_USER: customer_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer_service_dev}
    ports:
      - "${POSTGRES_PORT:-15433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_service -d customer_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer_service_test
      POSTGRES_USER: customer_service
      POSTGRES_PASSWORD: customer_service_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_service -d customer_service_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  integration-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "unittest", "discover", "-s", "tests/integration", "-v"]
    environment:
      TEST_DATABASE_URL: postgresql://customer_service:customer_service_test@postgres-test:5432/customer_service_test
    volumes:
      - ./tests:/app/tests:ro
    depends_on:
      postgres-test:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ENABLE_LLM_RESPONSE: ${ENABLE_LLM_RESPONSE:-false}
      DATABASE_URL: postgresql://customer_service:${POSTGRES_PASSWORD:-customer_service_dev}@postgres:5432/customer_service
      STAFF_API_KEYS: ${STAFF_API_KEYS:-}
      # Signs customer/staff session tokens and evidence image URLs. Unset =
      # random per-process secret (everyone is logged out on restart).
      AUTH_SECRET: ${AUTH_SECRET:-}
      # The demo has no customer passwords: "login" = pick a mock account.
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  action-worker:
    profiles: ["execution"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/workers/run_action_worker.py"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://customer_service:${POSTGRES_PASSWORD:-customer_service_dev}@postgres:5432/customer_service
      PAYMENT_REFUND_URL: ${PAYMENT_REFUND_URL:-}
      WAREHOUSE_EXCHANGE_URL: ${WAREHOUSE_EXCHANGE_URL:-}
      ORDER_CANCEL_URL: ${ORDER_CANCEL_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    profiles: ["execution"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/workers/run_scheduler.py", "--interval-seconds", "60"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://customer_service:${POSTGRES_PASSWORD:-customer_service_dev}@postgres:5432/customer_service
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # Optional LLM gateway (NewAPI): `docker compose --profile gateway up -d newapi`.
  # Configure the DeepSeek channel and create a token at http://localhost:${NEWAPI_PORT:-3002},
  # then point the backend at it with BASE_URL=http://newapi:3000/v1 in .env.
  newapi:
    profiles: ["gateway"]
    image: calciumion/new-api:latest
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${NEWAPI_PORT:-3002}:3000"
    volumes:
      - newapi_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  newapi_data:
