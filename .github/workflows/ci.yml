name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit tests + deterministic evaluation
    runs-on: ubuntu-latest
    env:
      # Evaluation must never reach a real LLM or database.
      ENABLE_LLM_RESPONSE: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q tests --ignore=tests/integration
      - name: Deterministic evaluation
        run: python scripts/evaluation/run_evaluation.py --report evaluation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: evaluation-report.json
          if-no-files-found: ignore

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: customer_service_test
          POSTGRES_USER: customer_service
          POSTGRES_PASSWORD: customer_service_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U customer_service -d customer_service_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://customer_service:customer_service_test@localhost:5432/customer_service_test
      ENABLE_LLM_RESPONSE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests/integration -v

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
